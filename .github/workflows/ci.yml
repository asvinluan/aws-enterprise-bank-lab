name: ci

# Static checks only. No AWS credentials are used or needed.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: fmt
        run: terraform fmt -check -recursive
      - name: init (no backend)
        run: terraform init -backend=false -input=false
      - name: validate (minimal profile)
        run: terraform validate
      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        run: |
          tflint --init
          tflint --recursive

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config scan (Terraform, CloudFormation, Dockerfile, Kubernetes)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"   # report only; tighten to "1" once findings are triaged

  cloudformation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cfn-lint
      - run: cfn-lint cloudformation/*.yaml

  scripts-and-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: shellcheck
        run: shellcheck -S warning cleanup/stop-the-meter.sh cloudformation/*.sh
      - name: python compile
        run: python -m compileall -q app
      - name: no account IDs or keys committed
        run: |
          if git grep -nE '(^|[^0-9])[0-9]{12}([^0-9]|$)' -- . ':!*.lock.hcl' ':!docs/*.pdf' | grep -v -E 'ACCOUNT|0{12}|123456789012'; then
            echo "Possible AWS account ID found"; exit 1
          fi
          if git grep -nE 'AKIA[0-9A-Z]{16}|aws_secret_access_key|BEGIN (RSA |EC )?PRIVATE KEY' -- . ':!.github/workflows/ci.yml' ':!docs'; then
            echo "Possible credential found"; exit 1
          fi
